[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceapp-core"
version = "0.1.0"
description = "Shared model loading, audio helpers and conversion interface for Voice App and VoiceAppStudio"
requires-python = ">=3.10"
# Keep this list tiny: everything here ends up in the Voice App installer.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# torch is only needed to open .pth files; the rest runs RVC inference.
# Each app decides which torch build (CPU or CUDA) to bundle, so these stay
# optional here. Versions follow the original requirements.txt.
torch = ["torch>=2.2.0"]
rvc = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "faiss-cpu>=1.8.0",
    "transformers>=4.40.0",
    "torchcrepe>=0.0.22",
    "torchfcpe>=0.0.4",
    "einops>=0.7.0",
    "noisereduce>=3.0.0",
    "webrtcvad-wheels>=2.0.10",
    "soundfile>=0.12.1",
]

[tool.setuptools.packages.find]
where = ["src"]
