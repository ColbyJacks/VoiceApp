[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceapp-studio"
version = "0.1.0"
description = "VoiceAppStudio: dataset prep and training for RVC .pth voice models"
requires-python = ">=3.10"
# The heavy training stack lives here and only here.
dependencies = [
    "voiceapp-core[torch]",
    "numpy>=1.24",
    "torchaudio>=2.1",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "faiss-cpu>=1.7.4",
    "tensorboard>=2.14",
]

[project.scripts]
voiceapp-studio = "voiceapp_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
