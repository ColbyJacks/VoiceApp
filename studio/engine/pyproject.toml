[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceapp-studio"
version = "0.1.0"
description = "VoiceAppStudio: dataset prep and training for RVC .pth voice models"
requires-python = ">=3.10"
# The heavy training stack lives here and only here. Training code is in the
# same rvc namespace as core (src/rvc/train), so Applio imports keep working.
dependencies = [
    "voiceapp-core[rvc]",
    "numpy>=1.24",
    "resampy>=0.4.3",
    "scikit-learn>=1.3",
    "tensorboard>=2.16.0",
    "matplotlib>=3.8.0",
    "edge-tts>=6.1.9",
    "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
# The Applio web UI in studio/applio.
applio = ["gradio>=4.30.0", "beautifulsoup4>=4.12.0", "psutil>=5.9.0", "pypresence>=4.3.0"]

[project.scripts]
voiceapp-studio = "voiceapp_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json"]
